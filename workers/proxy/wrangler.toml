name = "vibview-proxy"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# PROXY_HMAC_SECRET is stored as a Worker secret (not here).
# Set it with: npx wrangler secret put PROXY_HMAC_SECRET
# ALLOWED_ORIGIN is the Vercel deployment URL.
ALLOWED_ORIGIN = "https://vibview.app"

# For local dev: copy .dev.vars.example to .dev.vars and fill in PROXY_HMAC_SECRET
